services:
  api:
    build:
      context: ./src/Todo.Api
    ports:
      - "8080:8080"
    environment:
      Db__Host: db
      Db__Port: "5432"
      Db__Name: tododb
      Db__Username: postgres
      Db__Password: localdevpassword
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: localdevpassword
      POSTGRES_DB: tododb
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- サーバーレス版(DynamoDB)の動作確認用。`docker compose --profile dynamodb up` のときだけ起動する ---
  # AWSには接続せず、AWS公式のDynamoDB Localを使う(データはメモリ上のみで、停止すると消える)
  dynamodb:
    image: amazon/dynamodb-local
    profiles: [dynamodb]
    command: -jar DynamoDBLocal.jar -inMemory
    ports:
      - "127.0.0.1:8000:8000"

  # テーブルはアプリではなくインフラ側(AWS上ではTerraform)で作る方針のため、ローカルでもCLIで作る
  dynamodb-init:
    image: amazon/aws-cli
    profiles: [dynamodb]
    environment: &dynamodb-local-credentials
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: ap-northeast-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 1 30); do
          aws dynamodb create-table --endpoint-url http://dynamodb:8000 \
            --table-name todo-api-todos \
            --attribute-definitions AttributeName=id,AttributeType=S \
            --key-schema AttributeName=id,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST > /dev/null && exit 0
          sleep 1
        done
        exit 1
    depends_on:
      - dynamodb

  api-dynamodb:
    build:
      context: ./src/Todo.Api
    profiles: [dynamodb]
    ports:
      - "8081:8080"
    environment:
      <<: *dynamodb-local-credentials
      Storage__Provider: DynamoDb
      DynamoDb__ServiceUrl: http://dynamodb:8000
      DynamoDb__TableName: todo-api-todos
    depends_on:
      dynamodb-init:
        condition: service_completed_successfully

volumes:
  db-data:
